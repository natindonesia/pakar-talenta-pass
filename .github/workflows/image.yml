name: Images

# Builds and pushes the web and worker images to GHCR on every push to master.
# Consumed by natindonesia/infrastructure-playbook (gitops/pakar-talenta-pass-production).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/natindonesia/pakar-talenta-pass-web:sha-${{ github.sha }}
            ghcr.io/natindonesia/pakar-talenta-pass-web:master

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/natindonesia/pakar-talenta-pass-worker:sha-${{ github.sha }}
            ghcr.io/natindonesia/pakar-talenta-pass-worker:master
